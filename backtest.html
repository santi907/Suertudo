<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backtest — Visión Verde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">

    <header class="hero">
      <svg class="corner-graphic" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M15 15 H85" />
        <path d="M15 15 V85" />
        <path d="M15 35 A20 20 0 0 1 35 15" />
      </svg>
      <h1>Backtest</h1>
      <p class="tagline">Corré el modelo sobre partidos ya jugados y compará contra el resultado real, mercado por mercado.</p>
    </header>

    <section class="panel">
      <h2 class="panel-title">1. Cargar historial</h2>
      <label for="historial-file">Archivo generado por "Exportar historial" (.json)</label>
      <input type="file" id="historial-file" accept="application/json,.json">
      <p id="file-info" class="tagline" style="margin:10px 0 0; text-align:left; font-size:0.85rem;"></p>
    </section>

    <section class="panel">
      <h2 class="panel-title">2. Correr</h2>
      <button id="run-btn" class="btn-primary" disabled>Correr backtest</button>
    </section>

    <section id="log-section" class="panel" style="display:none;">
      <h2 class="panel-title">Progreso</h2>
      <div id="log" style="font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--chalk-dim); white-space:pre-wrap; max-height:180px; overflow-y:auto;"></div>
    </section>

    <section id="results" class="results" style="display:none;">
      <h2 class="panel-title">Resultados por mercado</h2>
      <div id="results-content"></div>
    </section>

  </div>

  <script type="module" src="backtest.js"></script>
</body>
</html>
